name: Build & Test Plugin

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking (tsc --noEmit)
        run: npm run typecheck

      - name: Run headless unit tests (vitest)
        run: npm run test

      - name: Build production bundle (esbuild)
        run: npm run build

      - name: Validate distribution artifacts
        run: |
          test -f dist/main.js || { echo "::error::dist/main.js missing!"; exit 1; }
          test -f dist/manifest.json || { echo "::error::dist/manifest.json missing!"; exit 1; }
          echo "Build artifacts verified successfully: main.js and manifest.json exist."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-proposals-dist
          path: dist/
          retention-days: 7
